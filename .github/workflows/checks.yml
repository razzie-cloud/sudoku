name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sudoku_test
          POSTGRES_PASSWORD: sudoku-test-only
          POSTGRES_DB: sudoku_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U sudoku_test" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://sudoku_test:sudoku-test-only@127.0.0.1:5432/sudoku_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Require Chromium for browser checks
        run: |
          browser=$(command -v google-chrome || command -v chromium || true)
          test -n "$browser"
          printf 'CHROMIUM_EXECUTABLE_PATH=%s\n' "$browser" >> "$GITHUB_ENV"
      - run: test -z "$(gofmt -l cmd internal tests)"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - name: Verify the bundled collections
        run: |
          go run ./cmd/sudokuprep > /tmp/sudoku-collections.json
          cmp internal/catalog/collections.json /tmp/sudoku-collections.json
      - run: docker build -t sudoku:test .
